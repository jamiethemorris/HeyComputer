[project]
name = "heycomputer"
version = "0.2.1"
description = "Quiet voice and text commands for REAPER"
requires-python = ">=3.11"
dependencies = [
  "PyJWT[crypto]>=2.10.1,<3",
  "sounddevice>=0.5,<0.6", "numpy>=2,<3", "keyring>=25,<26",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
wake = ["sherpa-onnx>=1.13.8,<2", "sentencepiece>=0.2,<0.3"]
local-speech = [
  "mlx-whisper>=0.4.0,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "scipy>=1.14,<2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heycomputer"]
