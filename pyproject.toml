[project]
name = "heycomputer"
version = "0.1.0"
description = "Quiet voice and text commands for REAPER"
requires-python = ">=3.11"
dependencies = [
  "qrcode>=8,<9",
  "sounddevice>=0.5,<0.6", "numpy>=2,<3", "keyring>=25,<26",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heycomputer"]
